<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logoBlueViolet" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="65" y1="20" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="aiTagGrad" x1="165" y1="18" x2="205" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="#0F172A"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="url(#logoBlueViolet)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" stroke="url(#logoBlueViolet)" stroke-width="2.5" stroke-dasharray="3 2"/>
    <circle cx="24" cy="24" r="8" fill="url(#logoBlueViolet)"/>
    <circle cx="22" cy="22" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
    <!-- Focus brackets -->
    <path d="M12 18V14H16" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 14H36V18" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 30V34H16" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 34H36V30" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="68" y="38" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">
    Hire<tspan fill="#3B82F6">Lens</tspan>
  </text>
  
  <!-- AI Badge -->
  <rect x="172" y="20" width="34" height="20" rx="6" fill="url(#aiTagGrad)"/>
  <text x="180" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    AI
  </text>
</svg>
